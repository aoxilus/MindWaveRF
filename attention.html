<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindWave — Calibrar Attention</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/study-ui.css" />
  </head>
  <body class="noise-bg">
    <main class="app">
      <header class="top">
        <h1>Calibrar Attention</h1>
        <p id="conn" class="conn">bridge…</p>
      </header>

      <section class="hud">
        <div><span>Attention</span><strong id="att">—</strong></div>
        <div><span>Meditation</span><strong id="med">—</strong></div>
        <div><span>Señal</span><strong id="sig">—</strong></div>
        <div><span>Fase</span><strong id="phase">—</strong></div>
      </section>

      <section id="arena" class="arena">
        <div id="fix" class="fix" aria-hidden="true"></div>
        <p id="prompt" class="prompt">3 fases · 30 s cada una</p>
      </section>

      <section class="pred wait">
        <p class="pred-label">Resultado</p>
        <p id="pred-text" class="pred-text">Sin calibrar</p>
        <p id="pred-detail" class="pred-detail">Baseline → Foco → Distracción</p>
      </section>

      <section class="actions">
        <button id="start" type="button">Empezar</button>
        <button id="export" type="button" class="ghost" disabled>Exportar JSON (AI)</button>
      </section>
      <pre id="log" class="log"></pre>
    </main>
    <script type="module" src="/src/attention.js"></script>
  </body>
</html>
