<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindWave — Estudio lectura + forma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/study-ui.css" />
  </head>
  <body class="noise-bg exam">
    <main class="exam-app">
      <p id="conn" class="exam-conn" hidden></p>

      <section id="gate" class="exam-gate">
        <button id="start" type="button">Empezar</button>
        <button id="stop" type="button" class="ghost">No empezar</button>
      </section>

      <section id="stage" class="exam-stage hidden">
        <p id="read" class="exam-read hidden"></p>
        <p id="cue" class="exam-cue"></p>
        <div id="stim" class="exam-stim L hidden">
          <div id="shape" class="shape circle"></div>
          <span id="onfig" class="exam-onfig"></span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/calibrate.js"></script>
  </body>
</html>
